# the urn is generated dynamically. gotta use the name of it to find it
# testing hints:
#     Journal ck_balmora_samarys 10
#     GetJournalIndex ck_balmora_samarys

# reward guide:
# +3 KotD rep for easy delivery. +5 if you had to clear out the tomb.
# +1 Temple rep for all deliveries

# Balmora Quests!
# Can be West Gash tombs and Bitter Coast tombs:
# - https://en.uesp.net/wiki/Morrowind:West_Gash
# - https://en.uesp.net/wiki/Morrowind:Bitter_Coast
# "feldrelo sadri" can give the quests out. she doesn't have any vanilla quests.
# tombs to skip:
# - Sarano. it's a fighters guild quest
# - Andrano. it's a main quest
quests:
  - id: "ck_balmora_tharys"
    # https://en.uesp.net/wiki/Morrowind:Tharys_Ancestral_Tomb - undead guardians. super boring! maybe a good first quest.
    # directions:  it's wast of the silt strider port, closeby
    startCell: "Balmora, Temple"
    destCell: "Tharys Ancestral Tomb"
    urnName: "Remains of Mehra Tharys"
  - id: "ck_balmora_samarys"
    # https://en.uesp.net/wiki/Morrowind:Samarys_Ancestral_Tomb - undead guardians
    # directions:  it's along the coast between the Odai and Seyda Neen.
    startCell: "Balmora, Temple"
    destCell: "Samarys Ancestral Tomb"
    urnName: "Remains of Marvisia Samarys"
  - id: "ck_balmora_heran"
    # https://en.uesp.net/wiki/Morrowind:Heran_Ancestral_Tomb - looted, loose daedra!
    # directions-: it's south of Hla Oad
    startCell: "Balmora, Temple"
    destCell: "Heran Ancestral Tomb"
    urnName: "Remains of Joveth Heran"
    destCellEnterStage: 39
    destCellClearedStage: 40
  - id: "ck_balmora_norvayn"
    # https://en.uesp.net/wiki/Morrowind:Norvayn_Ancestral_Tomb - undead guardians
    # directions: northwest of balmora, along the road that passes the ancient dunmer stronghold Hlormaren
    startCell: "Balmora, Temple"
    destCell: "Norvayn Ancestral Tomb"
    urnName: "Remains of Rilvas Norvayn"
  - id: "ck_balmora_lleran"
    # "https://en.uesp.net/wiki/Morrowind:Lleran_Ancestral_Tomb - undead guardians
    # directions: follow the Odai south out of Balmora, then cross the bridge near the Shulk Egg Mine. Follow the road, and it will be on your left.
    startCell: "Balmora, Temple"
    destCell: "Lleran Ancestral Tomb"
    urnName: "Remains of Fendel Lleran"
  - id: "ck_balmora_sarys"
    # https://en.uesp.net/wiki/Morrowind:Sarys_Ancestral_Tomb - undead guardians. boring
    # directions:  it's on the coast, west of Seyda Neen.
    startCell: "Balmora, Temple"
    destCell: "Sarys Ancestral Tomb"
    urnName: "Remains of Galo Sarys"
  - id: "ck_balmora_andrethi"
    # "https://en.uesp.net/wiki/Morrowind:Andrethi_Ancestral_Tomb - vampires!
    # directions: west of balmora and south of the Norvayn Ancestral Tomb
    startCell: "Balmora, Temple"
    destCell: "Andrethi Ancestral Tomb"
    urnName: "Remains of Bylen Andrethi"
  - id: "ck_balmora_thelas"
    # https://en.uesp.net/wiki/Morrowind:Thelas_Ancestral_Tomb - undead guardians. boring
    # directions:  it's on the coast, west of Seyda Neen.
    startCell: "Balmora, Temple"
    destCell: "Thelas Ancestral Tomb"
    urnName: "Remains of Mehra Thelas"

  - id: "ck_balmora_thalas"
    # "https://en.uesp.net/wiki/Morrowind:Saren_Ancestral_Tomb - undead guardians
    # directions: follow the foyada near Fort Moonmoth north, then take a right at Assarnatamat.
    startCell: "Balmora, Temple"
    destCell: "Thalas Ancestral Tomb"
    urnName: "Remains of Drarym Thalas"

  - id: "ck_balmora_saren"
    # "https://en.uesp.net/wiki/Morrowind:Saren_Ancestral_Tomb - daedra!
    # directions: take the bridge near Fort Moonmoth. Once on the other side, travel northeast.
    startCell: "Balmora, Temple"
    destCell: "Saren Ancestral Tomb"
    urnName: "Remains of Felara Saren"
